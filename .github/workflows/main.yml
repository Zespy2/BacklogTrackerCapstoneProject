name: CSC325 CI/CD pipeline for Capstone Project.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

  dependencies:
    name: Dependencies
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install -r requirements.txt

  test:
    name: Test
    needs: dependencies
    runs-on: ubuntu-latest
    env:
      # Empyty key means code does not call Gemini, even if a test forgets to mock it. This is a security measure to prevent accidental calls to Gemini during testing.
      GEMINI_API_KEY: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: ./backend
        run: python manage.py test -v 2
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm build

  eval:
    name: Eval
    needs: test
    # Required stage: only run the evaluation suite on pull requests to main
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # Empyty key means code does not call Gemini, even if a test forgets to mock it. This is a security measure to prevent accidental calls to Gemini during testing.
      GEMINI_API_KEY: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI evaluation suite
        working-directory: ./backend
        run: python evaluations/run_evals.py

  deploy:
    name: Deploy
    needs: test
    # Only deploy after changes are mergedinto main (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy application
        run: echo "Tests passed. Deploying application..."
